[project]
name = "spotify-tidal-migrator"
version = "0.2.0"
description = "Harvest a Spotify user's public playlists, review/select them, and push them to Tidal as public playlists."
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "tidalapi>=0.8.4",
    "rapidfuzz>=3.9",
    "platformdirs>=4.2",
    "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
build = ["pyinstaller>=6.10"]
dev = ["ruff>=0.7", "pre-commit>=3.8", "commitizen>=4.18"]

[project.scripts]
spotify-tidal-migrator = "spotify_tidal_migrator.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotify_tidal_migrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["spotify_tidal_migrator"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.2.0"
version_files = ["pyproject.toml:version"]
tag_format = "v$version"
update_changelog_on_bump = true
